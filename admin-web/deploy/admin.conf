map $http_x_real_ip $trusted_client_ip {
    default $remote_addr;
    "~^[0-9A-Fa-f:.]{3,45}$" $http_x_real_ip;
}

map $http_x_forwarded_for $trusted_forwarded_for {
    default $trusted_client_ip;
}

proxy_cache_path /var/cache/nginx/admin_st_thumb_cache levels=1:2 keys_zone=admin_st_thumb_cache:32m max_size=512m inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 30m;

    location = /silly-api/admin/jiugai/upload/image {
        proxy_pass http://backend:8080/admin/jiugai/upload/image;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location = /silly-api/admin/jiugai/character/import-sillytavern-png {
        proxy_pass http://backend:8080/admin/jiugai/character/import-sillytavern-png;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /silly-api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    location /prod-api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
    }

    # Admin role list can load ST portraits without routing original files through Spring.
    location ^~ /silly-api/api/v1/st-assets/characters/ {
        alias /srv/st-data/default-user/characters/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }

    # Admin thumbnails still go through Spring once, then hit Spring disk cache.
    location ^~ /silly-api/api/v1/st-assets/characters-thumb/ {
        proxy_pass http://backend:8080/api/v1/st-assets/characters-thumb/;
        proxy_cache admin_st_thumb_cache;
        proxy_cache_key "$scheme$request_method$host$request_uri$http_accept";
        proxy_cache_lock on;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 5m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 20s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_hide_header Cache-Control;
        expires 7d;
        add_header Cache-Control "public, max-age=604800" always;
        add_header Vary "Accept" always;
        add_header X-Cache-Status $upstream_cache_status always;
        access_log off;
    }

    location /uploads/ {
        alias /srv/uploads/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
        try_files $uri =404;
    }

    # Illustration works are stored and served by Spring under /art/.
    # The H5 site already proxies this path; admin needs the same route for card previews.
    location ^~ /art/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $trusted_client_ip;
        proxy_set_header X-Forwarded-For $trusted_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        access_log off;
    }
}
